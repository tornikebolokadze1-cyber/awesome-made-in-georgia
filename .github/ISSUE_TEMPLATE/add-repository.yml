name: "🇬🇪 Add a repository"
description: "Suggest an open source project built by a Georgian developer"
title: "[Add] "
labels: ["new-repo"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Before filling this in, have a look at [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) — it defines what counts as Georgian and what the quality bar is.

        You are welcome to write the description in English or Georgian.

  - type: input
    id: repo-url
    attributes:
      label: Repository URL
      placeholder: https://github.com/user/repo
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - 🤖 AI Agents & Orchestration
        - 🛠️ Developer Tools
        - 🔤 Georgian Language & NLP
        - 🌐 Web & Applications
        - 📦 Libraries & SDKs
        - 🎮 Games & Graphics
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: georgian-criterion
    attributes:
      label: Why does this count as Georgian?
      description: Pick the criterion this project meets
      options:
        - The author or lead maintainer is Georgian
        - A Georgian company / team / university runs it
        - The project targets the Georgian language (NLP, fonts, keyboards, etc.)
    validations:
      required: true

  - type: input
    id: proof
    attributes:
      label: Supporting link
      description: GitHub profile, personal site, LinkedIn, or any other public source
      placeholder: https://github.com/username
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: 2–6 sentences on what the project does and why it is interesting. End with the language and license.
      placeholder: |
        Example: A CLI tool that ... . Unlike similar tools it ... . Python, MIT.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The repository is public and has a README
          required: true
        - label: The repository has a license
          required: true
        - label: This is not a tutorial reproduction or a course exercise
          required: true
        - label: I checked that it is not already in the list
          required: true

  - type: checkboxes
    id: self-submission
    attributes:
      label: Is this your own project?
      options:
        - label: Yes, this is mine (entirely welcome — we just like to know)
          required: false
