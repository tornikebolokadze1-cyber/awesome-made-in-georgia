<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <!-- Brand gradient: dark navy bg (shared with awesome-ai-pulse-georgia) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#172030"/>
    </linearGradient>
    <!-- Brand accent gradient: cyan to purple -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D0FF"/>
      <stop offset="100%" style="stop-color:#A949DA"/>
    </linearGradient>
    <linearGradient id="accent135" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D0FF"/>
      <stop offset="100%" style="stop-color:#A949DA"/>
    </linearGradient>
    <filter id="text-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!--
    Bolnisi cross (the five-cross motif of the Georgian flag) is drawn as an explicit
    <path> everywhere rather than <defs> + <use>. GitHub sanitises SVGs it serves from a
    repository and <use> references are not reliably preserved, so inlining keeps the
    banner rendering identically on GitHub, on the site and in local previews.
    Path geometry: 20x20 box centred on 0,0.
  -->

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>

  <!-- Grid pattern (matching the sister list) -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="900" y2="280" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#00CFFF" stroke-width="0.5"/>
  </g>

  <!-- Decorative glow circles -->
  <circle cx="755" cy="130" r="105" fill="none" stroke="#A949DA" stroke-width="1" opacity="0.12"/>
  <circle cx="755" cy="130" r="150" fill="none" stroke="#00D0FF" stroke-width="0.5" opacity="0.07"/>
  <circle cx="130" cy="272" r="70" fill="none" stroke="#A949DA" stroke-width="0.8" opacity="0.08"/>

  <!-- Georgian five-cross flag motif, rendered in brand colours -->
  <g>
    <!-- large cross: kept low so it reads as background texture, not a foreground shape -->
    <g opacity="0.11">
      <rect x="747" y="62" width="17" height="136" rx="1" fill="#00D0FF"/>
      <rect x="672" y="121" width="167" height="17" rx="1" fill="#00D0FF"/>
    </g>
  </g>
  <!-- four Bolnisi crosses in the quadrants, brighter so the five-cross pattern is legible -->
  <g opacity="0.3">
    <path d="M -4,-10 L 4,-10 L 3,-3 L 10,-4 L 10,4 L 3,3 L 4,10 L -4,10 L -3,3 L -10,4 L -10,-4 L -3,-3 Z" transform="translate(709,92) scale(0.62)" fill="#A949DA"/>
    <path d="M -4,-10 L 4,-10 L 3,-3 L 10,-4 L 10,4 L 3,3 L 4,10 L -4,10 L -3,3 L -10,4 L -10,-4 L -3,-3 Z" transform="translate(802,92) scale(0.62)" fill="#A949DA"/>
    <path d="M -4,-10 L 4,-10 L 3,-3 L 10,-4 L 10,4 L 3,3 L 4,10 L -4,10 L -3,3 L -10,4 L -10,-4 L -3,-3 Z" transform="translate(709,168) scale(0.62)" fill="#A949DA"/>
    <path d="M -4,-10 L 4,-10 L 3,-3 L 10,-4 L 10,4 L 3,3 L 4,10 L -4,10 L -3,3 L -10,4 L -10,-4 L -3,-3 Z" transform="translate(802,168) scale(0.62)" fill="#A949DA"/>
  </g>

  <!-- Code brackets (signature element: this list is about source code) -->
  <g transform="translate(58, 92)" opacity="0.9">
    <path d="M 26,0 L 8,0 L 8,72 L 26,72" fill="none" stroke="url(#accent135)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 62,0 L 80,0 L 80,72 L 62,72" fill="none" stroke="url(#accent135)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -4,-10 L 4,-10 L 3,-3 L 10,-4 L 10,4 L 3,3 L 4,10 L -4,10 L -3,3 L -10,4 L -10,-4 L -3,-3 Z" transform="translate(44,36) scale(1.15)" fill="url(#accent)"/>
  </g>

  <!-- Main title: MADE IN -->
  <text x="180" y="118" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="50" font-weight="800" fill="url(#accent)" filter="url(#text-shadow)" letter-spacing="2">
    MADE IN
  </text>
  <!-- GEORGIA -->
  <text x="180" y="172" font-family="'Segoe UI', 'SF Pro Display', Arial, sans-serif" font-size="50" font-weight="800" fill="#FAFAFA" filter="url(#text-shadow)" letter-spacing="3">
    GEORGIA
  </text>

  <!-- Tagline -->
  <text x="180" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#B3B3B3" letter-spacing="0.5">
    ქართველი დეველოპერების შექმნილი ღია კოდის კურირებული კოლექცია
  </text>

  <!-- Accent line under tagline -->
  <rect x="180" y="220" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Bottom bar -->
  <rect x="0" y="260" width="900" height="60" fill="#111827" fill-opacity="0.7"/>
  <rect x="0" y="260" width="900" height="1" fill="url(#accent)" opacity="0.2"/>

  <!-- Bottom stats -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13">
    <text x="80" y="296" text-anchor="middle">
      <tspan fill="#00D0FF" font-weight="700" font-size="20">2</tspan>
      <tspan dx="6" fill="#B3B3B3">რეპო</tspan>
    </text>
    <text x="220" y="296" text-anchor="middle">
      <tspan fill="#A949DA" font-weight="700" font-size="20">6</tspan>
      <tspan dx="6" fill="#B3B3B3">კატეგორია</tspan>
    </text>
    <g transform="translate(380, 283)">
      <rect x="0" y="0" width="108" height="24" rx="12" fill="rgba(0,208,255,0.15)" stroke="#00D0FF" stroke-width="0.5"/>
      <text x="54" y="16" text-anchor="middle" fill="#00D0FF" font-size="11" font-weight="600">Open Source</text>
    </g>
    <g transform="translate(498, 283)">
      <rect x="0" y="0" width="96" height="24" rx="12" fill="rgba(169,73,218,0.15)" stroke="#A949DA" stroke-width="0.5"/>
      <text x="48" y="16" text-anchor="middle" fill="#A949DA" font-size="11" font-weight="600">Sakartvelo</text>
    </g>
    <g transform="translate(604, 283)">
      <rect x="0" y="0" width="88" height="24" rx="12" fill="rgba(0,208,255,0.15)" stroke="#00D0FF" stroke-width="0.5"/>
      <text x="44" y="16" text-anchor="middle" fill="#00D0FF" font-size="11" font-weight="600">ქართული</text>
    </g>
    <text x="790" y="296" text-anchor="middle" fill="#B3B3B3" font-size="12">
      <tspan fill="#00D0FF">&#9733;</tspan>
      <tspan dx="4" fill="#FAFAFA" font-weight="600">aipulsegeorgia.ge</tspan>
    </text>
  </g>
</svg>
