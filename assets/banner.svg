<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <!--
    Cover art. Every shape is an explicit primitive: GitHub sanitises SVGs served
    from a repository, so no <use>, no <style>, no external font, no blend modes.
    Composition, back to front: sky gradient -> atmospheric glow -> star field ->
    five-cross constellation -> anamorphic streak -> three mountain ridges with
    aerial perspective -> type -> vignette -> film grain.
  -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060C"/>
      <stop offset="45%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#0E1729"/>
    </linearGradient>

    <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D0FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#00A2D8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00D0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleHaze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A949DA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A949DA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D0FF"/>
      <stop offset="100%" stop-color="#A949DA"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D6E8"/>
    </linearGradient>

    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D0FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8FE6FF" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#C9A7FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A949DA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ridgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7FE3FF" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#C4A2FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A949DA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="softBlur" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="wideBlur" x="-30%" y="-120%" width="160%" height="340%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tinyGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="titleGlow" x="-25%" y="-90%" width="150%" height="320%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feFlood flood-color="#0088C4" flood-opacity="0.55" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="s"/>
      <feMerge>
        <feMergeNode in="s"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="460" fill="url(#sky)" rx="14"/>

  <!-- Atmospheric light pooling behind the range and off to the right -->
  <ellipse cx="560" cy="352" rx="520" ry="150" fill="url(#horizonGlow)"/>
  <ellipse cx="1010" cy="180" rx="300" ry="210" fill="url(#purpleHaze)"/>

  <!-- Star field -->
  <g fill="#DCEBFF">
    <circle cx="118" cy="66" r="1.3" opacity="0.55"/>
    <circle cx="205" cy="122" r="0.9" opacity="0.35"/>
    <circle cx="291" cy="52" r="1.1" opacity="0.45"/>
    <circle cx="372" cy="105" r="0.8" opacity="0.28"/>
    <circle cx="455" cy="61" r="1.4" opacity="0.6"/>
    <circle cx="534" cy="132" r="0.9" opacity="0.3"/>
    <circle cx="618" cy="45" r="1"   opacity="0.4"/>
    <circle cx="702" cy="118" r="1.2" opacity="0.5"/>
    <circle cx="781" cy="70" r="0.85" opacity="0.32"/>
    <circle cx="862" cy="138" r="1.1" opacity="0.42"/>
    <circle cx="1096" cy="58" r="1.2" opacity="0.5"/>
    <circle cx="1152" cy="128" r="0.9" opacity="0.33"/>
    <circle cx="64"  cy="158" r="1"   opacity="0.36"/>
    <circle cx="248" cy="196" r="0.8" opacity="0.26"/>
    <circle cx="948" cy="210" r="0.9" opacity="0.3"/>
  </g>

  <!-- The five-cross flag of Georgia, drawn as a constellation -->
  <g transform="translate(992,112)">
    <g stroke="#8FE6FF" stroke-opacity="0.22" stroke-width="1">
      <line x1="0" y1="-62" x2="0" y2="62"/>
      <line x1="-78" y1="0" x2="78" y2="0"/>
    </g>
    <g fill="#BFEFFF" filter="url(#tinyGlow)">
      <circle cx="0" cy="0" r="2.8"/>
      <circle cx="-42" cy="-32" r="2"/>
      <circle cx="42" cy="-32" r="2"/>
      <circle cx="-42" cy="32" r="2"/>
      <circle cx="42" cy="32" r="2"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="0" cy="0" r="1.5"/>
      <circle cx="-42" cy="-32" r="1.1"/>
      <circle cx="42" cy="-32" r="1.1"/>
      <circle cx="-42" cy="32" r="1.1"/>
      <circle cx="42" cy="32" r="1.1"/>
    </g>
  </g>

  <!-- Anamorphic light streak behind the wordmark -->
  <rect x="120" y="222" width="960" height="3" fill="url(#streak)" filter="url(#wideBlur)" opacity="0.85"/>

  <!--
    Caucasus range: three ridges lightening toward the back (aerial perspective).
    Peak heights and slope lengths are deliberately irregular — evenly spaced
    triangles of equal height read as a chart, not as mountains.
  -->
  <path d="M 0,405 L 68,352 L 118,378 L 196,300 L 250,341 L 318,368 L 392,317 L 452,357 L 520,330 L 596,387 L 664,325 L 742,364 L 800,341 L 878,393 L 946,335 L 1020,371 L 1086,344 L 1148,383 L 1200,357 L 1200,460 L 0,460 Z"
        fill="#1D2B47" opacity="0.72"/>
  <path d="M 0,405 L 68,352 L 118,378 L 196,300 L 250,341 L 318,368 L 392,317 L 452,357 L 520,330 L 596,387 L 664,325 L 742,364 L 800,341 L 878,393 L 946,335 L 1020,371 L 1086,344 L 1148,383 L 1200,357"
        fill="none" stroke="url(#ridgeLight)" stroke-width="1.3"/>

  <path d="M 0,428 L 84,389 L 148,413 L 226,361 L 300,399 L 372,377 L 448,415 L 528,371 L 604,407 L 690,375 L 764,413 L 846,381 L 922,417 L 1008,387 L 1090,419 L 1160,395 L 1200,411 L 1200,460 L 0,460 Z"
        fill="#131E36" opacity="0.88"/>
  <path d="M 0,428 L 84,389 L 148,413 L 226,361 L 300,399 L 372,377 L 448,415 L 528,371 L 604,407 L 690,375 L 764,413 L 846,381 L 922,417 L 1008,387 L 1090,419 L 1160,395 L 1200,411"
        fill="none" stroke="#7FE3FF" stroke-opacity="0.18" stroke-width="1"/>

  <path d="M 0,450 L 110,417 L 210,443 L 316,409 L 430,441 L 548,415 L 664,445 L 784,419 L 900,447 L 1024,423 L 1140,449 L 1200,435 L 1200,460 L 0,460 Z"
        fill="#060A14"/>

  <!-- Wordmark -->
  <text x="600" y="176" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#6FD8F5" opacity="0.8" letter-spacing="7">
    AWESOME · OPEN SOURCE
  </text>

  <text x="600" y="252" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="70" font-weight="800" fill="url(#titleFill)" filter="url(#titleGlow)" letter-spacing="3">
    MADE IN GEORGIA
  </text>

  <rect x="540" y="272" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.85"/>
  <rect x="540" y="272" width="120" height="2" rx="1" fill="url(#accent)" opacity="0.5" filter="url(#softBlur)"/>

  <text x="600" y="306" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16.5" fill="#9DB2CC" letter-spacing="0.4">
    Open source built in Sakartvelo — the country in the Caucasus
  </text>

  <text x="600" y="438" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="11.5" fill="#7C93AF" opacity="0.75" letter-spacing="4">
    CURATED BY AI PULSE GEORGIA
  </text>

  <!-- Vignette + film grain -->
  <rect width="1200" height="460" fill="url(#vignette)" rx="14"/>
  <rect width="1200" height="460" filter="url(#grain)" opacity="0.055" rx="14"/>
</svg>
